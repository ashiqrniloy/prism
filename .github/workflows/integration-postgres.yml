name: integration-postgres

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: postgres (sessions + enterprise)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism -d prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRISM_TEST_POSTGRES_URL: postgres://prism:prism@localhost:5432/prism
    steps:
      - name: redact connection string
        run: echo "::add-mask::${PRISM_TEST_POSTGRES_URL}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build:core && npm run build -w @arnilo/prism-core
      - name: run prism-core postgres suites
        timeout-minutes: 8
        run: |
          npm run test:postgres --workspace @arnilo/prism-core
          node --test scripts/phase27-ha.test.mjs
      - name: migration rollback/restore drill (plan 060)
        timeout-minutes: 5
        run: |
          node scripts/drill-migration-rollback.mjs --self-test
          node scripts/drill-migration-rollback.mjs --url "${PRISM_TEST_POSTGRES_URL}"
