name: integration-postgres

# Plan 215 Task 36: the one Postgres body. It runs on every push to main and the release
# pipeline calls it (`workflow_call`) instead of keeping a second copy of the same job.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: postgres (store, channels, conformance, migration drill)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector: the durable memory legs need the extension when they are credentialed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism -d prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRISM_TEST_POSTGRES_URL: postgres://prism:prism@localhost:5432/prism
    steps:
      - name: redact connection string
        run: echo "::add-mask::${PRISM_TEST_POSTGRES_URL}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun run build
      # One leg list for both callers: the store suite, the channels suite and the durable
      # conformance legs, then the evidence doc `release:gate` reads.
      - name: run postgres suites and record evidence
        timeout-minutes: 8
        run: bun run test:postgres
      - name: migration rollback/restore drill (plan 060)
        timeout-minutes: 5
        run: |
          bun scripts/drill-migration-rollback.mjs --self-test
          bun scripts/drill-migration-rollback.mjs --url "${PRISM_TEST_POSTGRES_URL}"
