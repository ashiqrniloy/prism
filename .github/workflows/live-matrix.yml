name: live-matrix

on:
  schedule:
    # Thursdays 06:17 UTC, after the Tuesday canaries; keeps cost bounded.
    - cron: "17 6 * * 4"
  workflow_dispatch:
    inputs:
      filter:
        description: "PRISM_LIVE_FILTER substring (suite id); empty runs every credentialed suite"
        required: false
        default: "providers/opencode-go"
      strict:
        description: "Fail the run on any skipped suite (PRISM_LIVE_STRICT=1)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: live-matrix
  cancel-in-progress: true

jobs:
  matrix:
    environment: live-canaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: install and build
        run: npm ci && npm run build
      - name: strict live matrix (skip-not-fail; strict inverts skips to run failures)
        timeout-minutes: 25
        env:
          PRISM_LIVE_PROVIDER_TESTS: "1"
          PRISM_LIVE_STRICT: ${{ (github.event_name == 'schedule' || inputs.strict) && '1' || '' }}
          PRISM_LIVE_FILTER: ${{ inputs.filter || 'providers/opencode-go' }}
          PRISM_LIVE_SUITE_TIMEOUT_MS: "600000"
          # Credentialed suites (operator-supplied via the live-canaries environment).
          # Add a secret here AND wire it below when credentialing more suites.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PRISM_LIVE_OPENCODE_MODEL: ${{ vars.PRISM_LIVE_OPENCODE_MODEL }}
        run: npm run test:live
      - name: e2e surface coverage gate (100% functional-surface)
        run: node scripts/e2e-coverage-gate.mjs --baseline --json > e2e-coverage-report.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: live-matrix-report-${{ github.run_id }}
          path: |
            docs/_evidence/live-matrix-report.json
            e2e-coverage-report.json
          if-no-files-found: warn
          retention-days: 7
