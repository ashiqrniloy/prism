name: live-matrix

on:
  schedule:
    # Thursdays 06:17 UTC, after the Tuesday canaries; keeps cost bounded.
    - cron: "17 6 * * 4"
  workflow_dispatch:
    inputs:
      filter:
        description: "PRISM_LIVE_FILTER substring (suite id); empty runs every credentialed suite"
        required: false
        default: "providers/opencode-go"
      memory_suite:
        description: "Dataset for the manual release/memory-bench row"
        type: choice
        options: [longmemeval-s, locomo, memoryagentbench-cr]
        default: longmemeval-s
      strict:
        description: "Fail the run on any skipped suite (PRISM_LIVE_STRICT=1)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: live-matrix
  cancel-in-progress: true

jobs:
  matrix:
    if: ${{ inputs.filter != 'release/memory-bench' }}
    environment: live-canaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: install and build
        run: bun ci && bun run build
      - name: strict live matrix (skip-not-fail; strict inverts skips to run failures)
        timeout-minutes: 25
        env:
          PRISM_LIVE_PROVIDER_TESTS: "1"
          PRISM_LIVE_STRICT: ${{ (github.event_name == 'schedule' || inputs.strict) && '1' || '' }}
          PRISM_LIVE_FILTER: ${{ inputs.filter || 'providers/opencode-go' }}
          PRISM_LIVE_SUITE_TIMEOUT_MS: "600000"
          # Credentialed suites (operator-supplied via the live-canaries environment).
          # Add a secret here AND wire it below when credentialing more suites.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PRISM_LIVE_OPENCODE_MODEL: ${{ vars.PRISM_LIVE_OPENCODE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bun run test:live
      - name: e2e surface coverage gate (100% functional-surface)
        run: bun scripts/e2e-coverage-gate.mjs --baseline --json > e2e-coverage-report.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: live-matrix-report-${{ github.run_id }}
          path: |
            docs/_evidence/live-matrix-report.json
            e2e-coverage-report.json
          if-no-files-found: warn
          retention-days: 7

  context-rot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.filter == 'release/context-rot' }}
    environment: live-canaries
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: install and build
        run: bun ci && bun run build
      - name: release/context-rot Hyper (manual only)
        env:
          HYPER_API_KEY: ${{ secrets.HYPER_API_KEY }}
          PRISM_LIVE_CONTEXT_ROT_HYPER_MODEL: ${{ vars.PRISM_LIVE_CONTEXT_ROT_HYPER_MODEL || 'deepseek-v4-pro-0813' }}
        run: timeout 14400 bun scripts/context-rot/run.mjs --provider hyper --model "$PRISM_LIVE_CONTEXT_ROT_HYPER_MODEL"
      - name: release/context-rot OpenCode Go (manual only)
        if: always()
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          PRISM_LIVE_CONTEXT_ROT_OPENCODE_MODEL: ${{ vars.PRISM_LIVE_CONTEXT_ROT_OPENCODE_MODEL || 'mimo-v2.5' }}
        run: timeout 14400 bun scripts/context-rot/run.mjs --provider opencode-go --model "$PRISM_LIVE_CONTEXT_ROT_OPENCODE_MODEL"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: context-rot-${{ github.run_id }}
          path: docs/_evidence/context-rot/
          if-no-files-found: warn
          retention-days: 30

  memory-bench:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.filter == 'release/memory-bench' }}
    environment: live-canaries
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: install benchmark dependencies
        run: |
          bun ci
          python3 -m venv /tmp/memory-bench-python
          /tmp/memory-bench-python/bin/pip install -r scripts/memory-bench/requirements.txt
      - name: release/memory-bench (manual only)
        env:
          PRISM_LIVE_MEMORY_BENCH_MANUAL: "1"
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          PRISM_LIVE_MEMORY_BENCH_MODEL: ${{ vars.PRISM_LIVE_MEMORY_BENCH_MODEL || 'mimo-v2.5' }}
          PRISM_MEMORY_BENCH_SUITE: ${{ inputs.memory_suite }}
          PRISM_MEMORY_BENCH_PYTHON: /tmp/memory-bench-python/bin/python
        run: timeout 21000 bun scripts/memory-bench/live.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: memory-bench-${{ github.run_id }}
          path: docs/_evidence/memory-bench/
          if-no-files-found: warn
          retention-days: 30
