name: release

on:
  push:
    branches: [main, master]
    tags: ["v0.3.0", "v0.4.0", "v0.5.0", "v0.5.1", "v0.5.2", "v0.5.3", "v0.5.4", "v0.5.5", "v0.5.6", "v0.6.0", "v0.7.0", "v0.8.0", "v0.9.0", "v0.10.0", "v0.11.0", "v0.11.1", "v0.12.0", "@arnilo/*@*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: "verify (SDK readiness: typecheck, test, pack dry-run)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Bun-only since plan 125 Task 1: the manifests declare `engines.bun >=1.4.2`, so the two
      # declared Node legs (this job's Node 24 smoke and `node22-compat`) retired with the engines
      # flip. The only Node left in this pipeline is the release-host registry toolchain in
      # `publish`; scripts/phase12-freeze-manifest.json keeps the 0.1.x Node matrix as era record.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - name: verify SDK readiness
        run: |
          set -o pipefail
          # The sdk:ready gate (bun run sdk:ready) runs phase-by-phase below so
          # a silent failure (no npm error output) still names the failing
          # phase in sdk-ready.log.
          #
          # PRISM_TEST_POSTGRES_URL is deliberately NOT ambient here. It is a
          # declared release-profile marker for release:gate only (the
          # release-evidence emitter attests the postgres durable surface's
          # required env is present; the postgres-integration job below runs
          # the durable legs for real and is unconditional in publish needs:).
          # If it leaked into npm test / test:coverage, the credential-gated
          # docs demo (examples/workflow-postgres-resume.ts) and the durable
          # integration suites would try to connect to a server this job does
          # not have and fail (ECONNREFUSED); env-free they skip, as in 0.2.2.
          # The packed-install enterprise journey is peer-gated on top of that:
          # its consumer installs only Prism tarballs and never the `pg` peer, so
          # an ambient value makes it print `SKIP durable postgres leg: …` and
          # run the memory event source (reported as a TAP diagnostic), not fail.
          phase() {
            echo "== sdk:ready phase: $1"
            shift
            "$@"
            rc=$?
            echo "== sdk:ready phase rc=$rc"
            [ "$rc" -eq 0 ] || exit 1
          }
          {
            phase typecheck bun run typecheck
            phase lint bun run lint
            phase format:check bun run format:check
            phase "bun run test" bun run test
            phase test:coverage bun run test:coverage
            phase pack:dry-run bun run pack:dry-run
            PRISM_TEST_POSTGRES_URL="postgres://prism:prism@localhost:5432/prism" PRISM_RELEASE_POSTGRES_JOB=1 phase release:gate bun run release:gate
            phase security:threat-suites bun run security:threat-suites
            echo "== sdk:ready all phases passed"
          } 2>&1 | tee sdk-ready.log
        timeout-minutes: 30
      - name: summarize SDK failure
        if: failure()
        run: |
          echo "### error markers in sdk-ready.log" >> "$GITHUB_STEP_SUMMARY"
          grep -nE '^== sdk:ready phase|^error:|Exited with code [1-9]|✖|AssertionError|Killed|SIGKILL|ELIFECYCLE|exceeded threshold|exceeded ceiling|WebAssembly|Out of memory|ENOMEM|No space left' sdk-ready.log | tail -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo "### tail of sdk-ready.log" >> "$GITHUB_STEP_SUMMARY"
          tail -200 sdk-ready.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: sdk-ready-log
          path: sdk-ready.log
          retention-days: 7
          if-no-files-found: ignore

      - name: retain release evidence manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence
          path: scripts/release-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: retain quality-gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-gate-reports
          path: |
            scripts/lint-report.sarif
            scripts/unused-report.json
          if-no-files-found: ignore
          retention-days: 30

  postgres-integration:
    name: postgres integration (session-store, memory, enterprise adapters)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism -d prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun run build
      - name: run postgres live adapter suite
        env:
          PRISM_TEST_POSTGRES_URL: postgres://prism:prism@localhost:5432/prism
        run: bun run test:postgres
        timeout-minutes: 5

  codeql-release:
    name: CodeQL release SAST
    if: github.ref == 'refs/tags/v0.3.0' || github.ref == 'refs/tags/v0.4.0' || github.ref == 'refs/tags/v0.5.0' || github.ref == 'refs/tags/v0.5.1' || github.ref == 'refs/tags/v0.5.2' || github.ref == 'refs/tags/v0.5.3' || github.ref == 'refs/tags/v0.5.4' || github.ref == 'refs/tags/v0.5.5' || github.ref == 'refs/tags/v0.5.6' || github.ref == 'refs/tags/v0.6.0' || github.ref == 'refs/tags/v0.7.0' || github.ref == 'refs/tags/v0.8.0' || github.ref == 'refs/tags/v0.9.0' || github.ref == 'refs/tags/v0.10.0' || github.ref == 'refs/tags/v0.11.0' || github.ref == 'refs/tags/v0.11.1' || github.ref == 'refs/tags/v0.12.0' || startsWith(github.ref, 'refs/tags/@arnilo/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  supply-chain:
    name: supply chain (audit, SPDX, licenses, source secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun audit --audit-level=moderate
      - run: |
          mkdir -p security-artifacts
          # release-host registry toolchain — runner images ship Node; contributors never invoke npm
          # npm is the registry toolchain here (pack/sbom, plan 125 Task 5): it runs on the
          # runner image's preinstalled Node — no setup-node step.
          npm sbom --sbom-format spdx > security-artifacts/sbom.spdx.json
          bun scripts/verify-sbom.mjs security-artifacts/sbom.spdx.json security/license-policy.json
          git ls-files -z | xargs -0 bun scripts/scan-secrets.mjs

  office-validation:
    name: "office validation (LibreOffice PDF conversion of golden artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun run build
      - name: install libreoffice headless
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
      - name: run office golden validation
        run: bun run --filter @arnilo/prism-work test:office

  publish:
    name: publish (deterministic, resumable, provenance)
    needs: [verify, postgres-integration, office-validation, codeql-release, supply-chain]
    if: github.ref == 'refs/tags/v0.3.0' || github.ref == 'refs/tags/v0.4.0' || github.ref == 'refs/tags/v0.5.0' || github.ref == 'refs/tags/v0.5.1' || github.ref == 'refs/tags/v0.5.2' || github.ref == 'refs/tags/v0.5.3' || github.ref == 'refs/tags/v0.5.4' || github.ref == 'refs/tags/v0.5.5' || github.ref == 'refs/tags/v0.5.6' || github.ref == 'refs/tags/v0.6.0' || github.ref == 'refs/tags/v0.7.0' || github.ref == 'refs/tags/v0.8.0' || github.ref == 'refs/tags/v0.9.0' || github.ref == 'refs/tags/v0.10.0' || github.ref == 'refs/tags/v0.11.0' || github.ref == 'refs/tags/v0.11.1' || github.ref == 'refs/tags/v0.12.0' || startsWith(github.ref, 'refs/tags/@arnilo/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun run build
      # release-host registry toolchain — runner images ship Node; contributors never invoke npm
      # Registry-toolchain exception (plan 125 Task 5): pack, publish, sbom and view run through
      # npm on the runner image's preinstalled Node. Probed 2026-09-25 on Bun 1.4.2: `bun pack`
      # does not exist and `bun publish` has no --provenance, so the registry contract stays npm's
      # (publish itself goes through `bun run release:publish`). No setup-node step pins that Node
      # on purpose.
      - name: pack release artifacts, checksums, SBOM, and secret scan
        run: |
          SAFE_REF=$(echo "$GITHUB_REF_NAME" | sed 's#[/@:]#-#g')
          echo "SAFE_REF=$SAFE_REF" >> "$GITHUB_ENV"
          mkdir -p release-artifacts
          npm pack --json --pack-destination release-artifacts > release-artifacts/core-pack.json
          npm pack --workspaces --json --pack-destination release-artifacts > release-artifacts/workspace-pack.json
          sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS
          npm sbom --sbom-format spdx > release-artifacts/sbom.spdx.json
          bun scripts/verify-sbom.mjs release-artifacts/sbom.spdx.json security/license-policy.json
          test "$(du -sb release-artifacts | cut -f1)" -le 134217728
          mkdir -p release-artifacts/unpacked
          for archive in release-artifacts/*.tgz; do
            dir="release-artifacts/unpacked/$(basename "$archive" .tgz)"
            mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir"
          done
          bun scripts/scan-secrets.mjs release-artifacts/unpacked
          rm -rf release-artifacts/unpacked
      - name: attest package artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-artifacts/*.tgz
      - name: attest SBOM artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-artifacts/sbom.spdx.json
      - name: retain release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-artifacts-${{ env.SAFE_REF }}
          path: release-artifacts
          retention-days: 30
      - name: wire registry auth
        # Registry auth reaches npm only through config keys (`//<registry>/:_authToken`) — and the
        # release-host registry toolchain (plan 125 Task 5) dropped setup-node's `registry-url`
        # write, so it is explicit here. The value stays the `${NODE_AUTH_TOKEN}` reference: npm
        # expands it from the publish step's env at publish time instead of storing the secret.
        run: |
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' >> "$HOME/.npmrc"
      - name: publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "v0.3.0" ] || [ "$GITHUB_REF_NAME" = "v0.4.0" ] || [ "$GITHUB_REF_NAME" = "v0.5.0" ] || [ "$GITHUB_REF_NAME" = "v0.5.1" ] || [ "$GITHUB_REF_NAME" = "v0.5.2" ] || [ "$GITHUB_REF_NAME" = "v0.5.3" ] || [ "$GITHUB_REF_NAME" = "v0.5.4" ] || [ "$GITHUB_REF_NAME" = "v0.5.5" ] || [ "$GITHUB_REF_NAME" = "v0.5.6" ] || [ "$GITHUB_REF_NAME" = "v0.6.0" ] || [ "$GITHUB_REF_NAME" = "v0.7.0" ] || [ "$GITHUB_REF_NAME" = "v0.8.0" ] || [ "$GITHUB_REF_NAME" = "v0.9.0" ] || [ "$GITHUB_REF_NAME" = "v0.10.0" ] || [ "$GITHUB_REF_NAME" = "v0.11.0" ] || [ "$GITHUB_REF_NAME" = "v0.11.1" ] || [ "$GITHUB_REF_NAME" = "v0.12.0" ]; then
            bun run release:publish -- --lockstep --version "${GITHUB_REF_NAME#v}" --resume --report release-artifacts/publish-report.json
          else
            bun run release:publish -- --resume --report release-artifacts/publish-report.json
          fi
      - name: retain publish report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publish-report-${{ env.SAFE_REF }}
          path: release-artifacts/publish-report.json
          if-no-files-found: warn
          retention-days: 30
