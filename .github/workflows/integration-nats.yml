name: integration-nats

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-nats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nats:
    name: nats (events + cursor + restart)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRISM_TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - name: redact connection string
        run: echo "::add-mask::${PRISM_TEST_NATS_URL}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun run build:core && bun run --filter @arnilo/prism-core build
      # GHA service containers cannot pass `-js`; JetStream is required.
      - name: start nats jetstream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2 -js
          timeout 30 bash -c 'until echo >/dev/tcp/127.0.0.1/4222; do sleep 1; done'
      - name: run prism-core nats suites
        timeout-minutes: 5
        run: bun run --filter @arnilo/prism-core test:nats
