name: deprecate

# Operator-dispatched registry deprecation for a published version range. The registry tool needs the
# same registry auth as the publish job, and publish auth is CI-only OIDC/NPM_TOKEN, so the operator
# action lives here instead of on a laptop. Plan 140 Task 6: the pre-0.4.0 `@arnilo/prism-code`
# releases are the coding-agent profile *library*; 0.4.0+ is the terminal app, so `npm install
# @arnilo/prism-code` on an old pin must warn and name the replacement.
#
# Deprecation is irreversible through npm (only an unpublish can remove the notice), so the inputs
# are explicit workflow inputs and the job prints the resolved `npm view` before and after.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package specifier, e.g. @arnilo/prism-code@<0.4.0"
        required: true
        type: string
      message:
        description: "Deprecation message shown to an installing user"
        required: true
        type: string
      confirm:
        description: 'Type "deprecate" to confirm (deprecations are one-way)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    name: deprecate a published range
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: refuse an unconfirmed dispatch
        run: |
          if [ "${{ inputs.confirm }}" != "deprecate" ]; then
            echo "confirmation must be the word 'deprecate'" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: wire registry auth
        # Same reasoning as release.yml: npm only reads the config key, and the value stays a
        # `${NODE_AUTH_TOKEN}` reference so no token is written to disk in the clear.
        run: printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' >> "$HOME/.npmrc"
      - name: deprecate
        # The inputs travel as environment variables, never interpolated into the script body: a
        # deprecation message legitimately contains quotes, pipes, and redirects.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SPEC: ${{ inputs.package }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          name="${SPEC%@*}"; version="${SPEC##*@}"
          if [ -z "$version" ] || [ "$version" = "$SPEC" ]; then
            echo "package must carry a version or range, e.g. @scope/name@<1.2.3" >&2
            exit 1
          fi
          echo "--- before ---"
          npm view "$name" deprecated --json || true
          npm deprecate "$SPEC" "$MESSAGE"
          echo "--- after ---"
          npm view "$name" deprecated --json
