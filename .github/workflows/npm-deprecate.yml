name: deprecate

# Operator-dispatched registry deprecation for the retired 0.13.0 names. `npm deprecate` is gone
# (plan 175 Task 8, backlog P2 "Phase 11 registry operations without npm"): the registry HTTP API
# does the same GET-then-PUT, so this job runs `bun scripts/registry-deprecate.mjs` against the
# committed list (scripts/deprecations-0.13.json) and no npm binary runs.
#
# Deprecation is irreversible through npm (only an unpublish can remove the notice), so the
# confirmation input stays, the read-only dry run previews every entry, and the script fails closed
# with zero mutations when a reused name's `latest` is still in the retired range or its 0.13.0 is
# not published yet.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deprecate" to confirm (deprecations are one-way)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    name: deprecate the retired 0.13.0 names
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: refuse an unconfirmed dispatch
        run: |
          if [ "${{ inputs.confirm }}" != "deprecate" ]; then
            echo "confirmation must be the word 'deprecate'" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - name: generate the plan from the live registry
        run: bun scripts/registry-deprecate.mjs --generate
      - name: preview the deprecation plan
        run: bun scripts/registry-deprecate.mjs --dry-run
      - name: apply the deprecation plan
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/registry-deprecate.mjs --apply --confirm
