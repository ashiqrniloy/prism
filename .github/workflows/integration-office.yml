name: integration-office

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-office-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office:
    name: office golden (packed artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun run build:core && bun run --filter @arnilo/prism-work build
      # Golden round-trips against the packed tarball (LibreOffice conversion
      # stays in release.yml office-validation on workspace source).
      - name: run office golden packed suites
        timeout-minutes: 5
        run: bun test --timeout=0 scripts/office-golden-packed.test.mjs
