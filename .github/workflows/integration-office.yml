name: integration-office

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-office-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office:
    name: office golden (packed artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build:core && npm run build -w @arnilo/prism-office
      # Golden round-trips against the packed tarball (LibreOffice conversion
      # stays in release.yml office-validation on workspace source).
      - name: run office golden packed suites
        timeout-minutes: 5
        run: node --test scripts/office-golden-packed.test.mjs
