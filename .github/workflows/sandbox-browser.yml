name: sandbox-browser

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-browser
  cancel-in-progress: true

jobs:
  protected-matrix:
    environment: sandbox-browser
    # Supported Linux runner: ubuntu-latest ships Docker Engine (protected Docker
    # matrix) and unshare/netns (native T9 capability evidence). No self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: install dependencies
        run: bun ci
      - name: build coding/browser packages
        run: |
          bun run build:core
          bun run --filter @arnilo/prism-core build
          bun run --filter @arnilo/prism-ag-ui build
          bun run --filter @arnilo/prism-coding-tools build
          bun run --filter @arnilo/prism-web-tools build
          bun run --filter @arnilo/prism-work build
      - name: network-free adversarial eval fixtures
        run: |
          bun run --filter @arnilo/prism-coding-tools test -- --test-name-pattern "adversarial"
          bun run --filter @arnilo/prism-web-tools test -- --test-name-pattern "adversarial"
      - name: sandbox isolation + egress denial legs (network-free)
        run: |
          bun run --filter @arnilo/prism-coding-tools test -- --test-name-pattern "egress|dns pin"
          bun run --filter @arnilo/prism-web-tools test -- --test-name-pattern "browser Task 6 policy"
      - name: protected Docker sandbox matrix
        if: ${{ vars.PRISM_TEST_DOCKER_IMAGE != '' }}
        timeout-minutes: 5
        env:
          PRISM_TEST_DOCKER_SANDBOX: "1"
          PRISM_TEST_DOCKER_BIN: /usr/bin/docker
          PRISM_TEST_DOCKER_IMAGE: ${{ vars.PRISM_TEST_DOCKER_IMAGE }}
          PRISM_TEST_DOCKER_USER: ${{ vars.PRISM_TEST_DOCKER_USER }}
        run: bun run --filter @arnilo/prism-coding-tools test -- --test-name-pattern "protected Docker"
      - name: native sandbox capability evidence (plan 020 Task 5)
        timeout-minutes: 5
        run: |
          set +e
          out=$(bun run --filter @arnilo/prism-coding-tools test -- --test-name-pattern "T9: native reports truthful capabilities" 2>&1)
          rc=$?
          set -e
          printf '%s' "$out" | grep "T9: native reports truthful capabilities" | tail -5
          # Match the T9 line itself: the pattern filters the package suite to this one
          # test, and Bun's reporter lists a filtered skip as "(skip) T9: …", so
          # unrelated skips elsewhere in the suite must not count.
          t9=$(printf '%s' "$out" | grep "T9: native reports truthful capabilities" || true)
          if [ "$rc" -ne 0 ] || [ -z "$t9" ]; then
            echo "native_capability=failed" >> "$GITHUB_ENV"
          elif printf '%s' "$t9" | grep -q "(skip) T9:"; then
            echo "native_capability=skipped" >> "$GITHUB_ENV"
          else
            echo "native_capability=passed" >> "$GITHUB_ENV"
          fi
      - name: 0.2.0 blocker gate - Docker/native capability evidence required (plan 020 Task 5)
        if: always()
        run: |
          failures=""
          if [ -z "${{ vars.PRISM_TEST_DOCKER_IMAGE }}" ]; then failures="$failures docker-missing"; fi
          if [ "${native_capability:-unset}" != "passed" ]; then failures="$failures native-${native_capability:-unset}"; fi
          if [ -n "$failures" ]; then
            echo "::error::0.2.0 blocker gate: capability evidence missing:$failures (never a passing skip)"
            exit 1
          fi
          echo "0.2.0 blocker gate: Docker + native capability evidence present"
      - name: cache Playwright chromium
        if: ${{ vars.PRISM_ENABLE_PLAYWRIGHT_GATE == '1' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          # Key follows the playwright-core that `bun ci` actually installed (the
          # browser build is version-coupled to it), so a dependency bump rotates the
          # cache without a literal version string to sweep. Plan 071 Task 4.
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: install Playwright chromium (host-pinned)
        if: ${{ vars.PRISM_ENABLE_PLAYWRIGHT_GATE == '1' }}
        run: bunx --no-install playwright-core install chromium
      - name: protected Playwright browser matrix
        if: ${{ vars.PRISM_ENABLE_PLAYWRIGHT_GATE == '1' }}
        timeout-minutes: 5
        env:
          PRISM_LIVE_PLAYWRIGHT: "1"
        run: bun run --filter @arnilo/prism-web-tools test:live
      - name: protected Obscura binary leg (plan 039)
        if: ${{ vars.PRISM_ENABLE_OBSCURA_GATE == '1' }}
        timeout-minutes: 5
        env:
          PRISM_LIVE_OBSCURA: "1"
          PRISM_OBSCURA_BIN: ${{ vars.PRISM_OBSCURA_BIN }}
        run: |
          bun run --filter @arnilo/prism-web-tools test -- --test-name-pattern "hostile|oversize|garbage|loopback|insecure"
          bun run --filter @arnilo/prism-web-tools test:live
      - name: protected self-hosted draw.io leg (plan 053 Task 4)
        if: ${{ vars.PRISM_ENABLE_DRAWIO_GATE == '1' }}
        timeout-minutes: 5
        env:
          PRISM_TEST_DRAWIO_URL: ${{ vars.PRISM_TEST_DRAWIO_URL || 'http://localhost:8080' }}
          # The draw.io suite lives in @arnilo/prism-work (packages/prism-work, diagrams)
          # and is owned by the live matrix, which resolves credentials and skips or
          # fails per its contract; the retired @arnilo/prism-diagrams package's
          # `test:drawio` script no longer exists. Plan 071 Task 4.
          PRISM_LIVE_FILTER: office/drawio-live
        run: bun scripts/live-matrix.mjs
      - name: benchmark schema (network-free)
        env:
          PRISM_BENCH_ITERATIONS: "10"
        run: bun test --timeout=0 scripts/benchmark.test.mjs
      - name: unused-code sweep (non-blocking report, plan 015 Task 3)
        continue-on-error: true
        run: bun run sweep:unused
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: unused-sweep-report-${{ github.run_id }}
          path: scripts/unused-sweep-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: write redacted aggregate evidence
        if: always()
        run: |
          bun -e 'const fs=require("fs"); fs.writeFileSync("sandbox-browser-report.json", JSON.stringify({generatedAt:new Date().toISOString(), docker:Boolean(process.env.PRISM_TEST_DOCKER_IMAGE), dockerEvidence:Boolean(process.env.PRISM_TEST_DOCKER_IMAGE), nativeCapability:process.env.NATIVE_CAPABILITY || "unset", capabilities:true, playwright:process.env.PRISM_ENABLE_PLAYWRIGHT_GATE==="1", obscura:process.env.PRISM_ENABLE_OBSCURA_GATE==="1", network:false, credentials:false}, null, 2))'
        env:
          PRISM_TEST_DOCKER_IMAGE: ${{ vars.PRISM_TEST_DOCKER_IMAGE }}
          PRISM_ENABLE_PLAYWRIGHT_GATE: ${{ vars.PRISM_ENABLE_PLAYWRIGHT_GATE }}
          PRISM_ENABLE_OBSCURA_GATE: ${{ vars.PRISM_ENABLE_OBSCURA_GATE }}
          NATIVE_CAPABILITY: ${{ env.native_capability }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sandbox-browser-status-${{ github.run_id }}
          path: sandbox-browser-report.json
          if-no-files-found: warn
          retention-days: 7
