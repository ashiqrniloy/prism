name: sandbox-browser

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-browser
  cancel-in-progress: true

jobs:
  protected-matrix:
    environment: sandbox-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: build coding/browser packages
        run: |
          npm run build:core
          npm run build -w @arnilo/prism-ag-ui
          npm run build -w @arnilo/prism-evals
          npm run build -w @arnilo/prism-workflows
          npm run build -w @arnilo/prism-coding-agent
          npm run build -w @arnilo/prism-coding-security
          npm run build -w @arnilo/prism-web-tools
          npm run build -w @arnilo/prism-diagrams
      - name: network-free adversarial eval fixtures
        run: |
          npm test -w @arnilo/prism-coding-agent -- --test-name-pattern "adversarial"
          npm test -w @arnilo/prism-web-tools -- --test-name-pattern "adversarial"
      - name: protected Docker sandbox matrix
        if: ${{ vars.PRISM_TEST_DOCKER_IMAGE != '' }}
        timeout-minutes: 5
        env:
          PRISM_TEST_DOCKER_SANDBOX: "1"
          PRISM_TEST_DOCKER_BIN: /usr/bin/docker
          PRISM_TEST_DOCKER_IMAGE: ${{ vars.PRISM_TEST_DOCKER_IMAGE }}
          PRISM_TEST_DOCKER_USER: ${{ vars.PRISM_TEST_DOCKER_USER }}
        run: npm test -w @arnilo/prism-coding-security -- --test-name-pattern "protected Docker"
      - name: native sandbox capability evidence (plan 020 Task 5)
        timeout-minutes: 5
        run: |
          set +e
          out=$(npm test -w @arnilo/prism-coding-security -- --test-name-pattern "T9: native reports truthful capabilities" 2>&1)
          rc=$?
          set -e
          printf '%s' "$out" | tail -20
          if [ "$rc" -ne 0 ]; then
            echo "native_capability=failed" >> "$GITHUB_ENV"
          elif printf '%s' "$out" | grep -qi 'skipped'; then
            echo "native_capability=skipped" >> "$GITHUB_ENV"
          else
            echo "native_capability=passed" >> "$GITHUB_ENV"
          fi
      - name: 0.2.0 blocker gate - Docker/native capability evidence required (plan 020 Task 5)
        if: always()
        run: |
          failures=""
          if [ -z "${{ vars.PRISM_TEST_DOCKER_IMAGE }}" ]; then failures="$failures docker-missing"; fi
          if [ "${native_capability:-unset}" != "passed" ]; then failures="$failures native-${native_capability:-unset}"; fi
          if [ -n "$failures" ]; then
            echo "::error::0.2.0 blocker gate: capability evidence missing:$failures (never a passing skip)"
            exit 1
          fi
          echo "0.2.0 blocker gate: Docker + native capability evidence present"
      - name: install Playwright chromium (host-pinned)
        if: ${{ vars.PRISM_ENABLE_PLAYWRIGHT_GATE == '1' }}
        run: npx --no-install playwright-core install chromium
      - name: protected Playwright browser matrix
        if: ${{ vars.PRISM_ENABLE_PLAYWRIGHT_GATE == '1' }}
        timeout-minutes: 5
        env:
          PRISM_LIVE_PLAYWRIGHT: "1"
        run: npm run test:live -w @arnilo/prism-web-tools
      - name: protected Obscura binary leg (plan 039)
        if: ${{ vars.PRISM_ENABLE_OBSCURA_GATE == '1' }}
        timeout-minutes: 5
        env:
          PRISM_LIVE_OBSCURA: "1"
          PRISM_OBSCURA_BIN: ${{ vars.PRISM_OBSCURA_BIN }}
        run: |
          npm test -w @arnilo/prism-web-tools -- --test-name-pattern "hostile|oversize|garbage|loopback|insecure"
          npm run test:live -w @arnilo/prism-web-tools
      - name: protected self-hosted draw.io leg (plan 053 Task 4)
        if: ${{ vars.PRISM_ENABLE_DRAWIO_GATE == '1' }}
        timeout-minutes: 5
        env:
          PRISM_TEST_DRAWIO_URL: ${{ vars.PRISM_TEST_DRAWIO_URL || 'http://localhost:8080' }}
        run: npm run test:drawio -w @arnilo/prism-diagrams
      - name: benchmark schema (network-free)
        env:
          PRISM_BENCH_ITERATIONS: "10"
        run: node --test scripts/benchmark.test.mjs
      - name: unused-code sweep (non-blocking report, plan 015 Task 3)
        continue-on-error: true
        run: npm run sweep:unused
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: unused-sweep-report-${{ github.run_id }}
          path: scripts/unused-sweep-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: write redacted aggregate evidence
        if: always()
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("sandbox-browser-report.json", JSON.stringify({generatedAt:new Date().toISOString(), docker:Boolean(process.env.PRISM_TEST_DOCKER_IMAGE), dockerEvidence:Boolean(process.env.PRISM_TEST_DOCKER_IMAGE), nativeCapability:process.env.NATIVE_CAPABILITY || "unset", capabilities:true, playwright:process.env.PRISM_ENABLE_PLAYWRIGHT_GATE==="1", obscura:process.env.PRISM_ENABLE_OBSCURA_GATE==="1", network:false, credentials:false}, null, 2))'
        env:
          PRISM_TEST_DOCKER_IMAGE: ${{ vars.PRISM_TEST_DOCKER_IMAGE }}
          PRISM_ENABLE_PLAYWRIGHT_GATE: ${{ vars.PRISM_ENABLE_PLAYWRIGHT_GATE }}
          PRISM_ENABLE_OBSCURA_GATE: ${{ vars.PRISM_ENABLE_OBSCURA_GATE }}
          NATIVE_CAPABILITY: ${{ env.native_capability }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sandbox-browser-status-${{ github.run_id }}
          path: sandbox-browser-report.json
          if-no-files-found: warn
          retention-days: 7
