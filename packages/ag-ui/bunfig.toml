# Plan 114 Task 2: Bun 1.4.2 reads coveragePathIgnorePatterns only from
# $cwd/bunfig.toml, so the package-local coverage row carries its own scoping
# (the equivalent of the old Node --test-coverage-include=dist/**). Only the
# displayed ../ prefix (repo root dist, sibling packages) is excluded; the
# package's own dist/** stays measured. No coverageThreshold key: enforcement is
# the parsed `All files` row in scripts/coverage-summary.mjs.
[test]
coveragePathIgnorePatterns = ["../**"]
